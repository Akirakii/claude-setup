<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" font-family="Inter, sans-serif">
<defs>
<marker id="ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0.5 L10,5 L0,9.5 Z" fill="#1F2328"/></marker>
<marker id="grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M0,0.5 L10,5 L0,9.5 Z" fill="#7A828E"/></marker>
</defs>
<rect width="1200" height="800" fill="#FBFBFA"/>
<text x="48" y="60" font-size="26" font-weight="650" fill="#1F2328" text-anchor="start" >Conscious and unconscious thinking</text>
<text x="48" y="88" font-size="15" font-weight="400" fill="#667080" text-anchor="start" >Your model: the interface steers, the raw power produces, and only requests and results cross between them.</text>
<rect x="48" y="120" width="1104" height="200" rx="16" fill="#EDF2FB"/>
<text x="72" y="154" font-size="13" fill="#2C55A0"><tspan font-weight="700" letter-spacing="1.2">CONSCIOUS</tspan><tspan dx="10" font-weight="500">the orchestrator interface</tspan></text>
<rect x="48" y="432" width="1104" height="200" rx="16" fill="#ECF5EE"/>
<text x="72" y="466" font-size="13" fill="#2B6E3F"><tspan font-weight="700" letter-spacing="1.2">UNCONSCIOUS</tspan><tspan dx="10" font-weight="500">the raw power</tspan></text>
<rect x="84" y="176" width="264" height="112" rx="12" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.5"/>
<text x="216" y="230" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >Working memory</text>
<text x="216" y="256" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >RAM: a few items, for seconds</text>
<rect x="468" y="176" width="264" height="112" rx="12" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
<text x="600" y="224" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >Orchestrator</text>
<text x="600" y="250" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >holds the goal, works one idea</text>
<text x="600" y="270" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >step by step, rejects what fails</text>
<path d="M852,188 A132.0,12 0 0 1 1116,188 V276 A132.0,12 0 0 1 852,276 Z" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.5"/>
<path d="M852,188 A132.0,12 0 0 0 1116,188" fill="none" stroke="#C5CBD3" stroke-width="1.5"/>
<text x="984" y="238" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >Shaped db</text>
<text x="984" y="264" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >facts and events you can recall</text>
<rect x="84" y="488" width="264" height="112" rx="12" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.5"/>
<text x="216" y="542" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >Unconscious RAM</text>
<text x="216" y="568" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >temporary state, can't be read</text>
<rect x="468" y="488" width="264" height="112" rx="12" fill="#FFFFFF" stroke="#1F2328" stroke-width="1.5"/>
<text x="600" y="536" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >Raw power</text>
<text x="600" y="562" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >produces the ideas, in the</text>
<text x="600" y="582" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >background, many at once</text>
<path d="M852,500 A132.0,12 0 0 1 1116,500 V588 A132.0,12 0 0 1 852,588 Z" fill="#FFFFFF" stroke="#C5CBD3" stroke-width="1.5"/>
<path d="M852,500 A132.0,12 0 0 0 1116,500" fill="none" stroke="#C5CBD3" stroke-width="1.5"/>
<text x="984" y="544" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >Unconscious db</text>
<text x="984" y="570" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >skills and patterns that</text>
<text x="984" y="590" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >behave like rules</text>
<line x1="356" y1="232" x2="460" y2="232" stroke="#7A828E" stroke-width="1.75" marker-end="url(#grey)" marker-start="url(#grey)"/>
<line x1="740" y1="232" x2="844" y2="232" stroke="#7A828E" stroke-width="1.75" marker-end="url(#grey)" marker-start="url(#grey)"/>
<text x="408" y="222" font-size="13" font-weight="500" fill="#667080" text-anchor="middle" >holds steps</text>
<text x="792" y="222" font-size="13" font-weight="500" fill="#667080" text-anchor="middle" >recall, store</text>
<line x1="356" y1="544" x2="460" y2="544" stroke="#7A828E" stroke-width="1.75" marker-end="url(#grey)" marker-start="url(#grey)"/>
<line x1="740" y1="544" x2="844" y2="544" stroke="#7A828E" stroke-width="1.75" marker-end="url(#grey)" marker-start="url(#grey)"/>
<text x="408" y="534" font-size="13" font-weight="500" fill="#667080" text-anchor="middle" >shapes results</text>
<text x="792" y="534" font-size="13" font-weight="500" fill="#667080" text-anchor="middle" >matches</text>
<line x1="564" y1="296" x2="564" y2="480" stroke="#1F2328" stroke-width="2.25" marker-end="url(#ink)"/>
<line x1="636" y1="480" x2="636" y2="296" stroke="#1F2328" stroke-width="2.25" marker-end="url(#ink)"/>
<text x="548" y="384" font-size="14" font-weight="600" fill="#1F2328" text-anchor="end" >request</text>
<text x="548" y="403" font-size="13" font-weight="400" fill="#667080" text-anchor="end" >the goal and the approach it holds</text>
<text x="652" y="384" font-size="14" font-weight="600" fill="#1F2328" text-anchor="start" >results only</text>
<text x="652" y="403" font-size="13" font-weight="400" fill="#667080" text-anchor="start" >ideas, “this follows”, “this is off”</text>
<line x1="1044" y1="296" x2="1044" y2="480" stroke="#7A828E" stroke-width="1.75" marker-end="url(#grey)"/>
<text x="1060" y="384" font-size="14" font-weight="600" fill="#1F2328" text-anchor="start" >practice</text>
<text x="1060" y="403" font-size="13" font-weight="400" fill="#667080" text-anchor="start" >moves a skill</text>
<text x="1060" y="421" font-size="13" font-weight="400" fill="#667080" text-anchor="start" >down</text>
<rect x="852" y="680" width="264" height="72" rx="12" fill="#FFFFFF" stroke="#7A828E" stroke-width="1.5" stroke-dasharray="6 5"/>
<text x="984" y="711" font-size="18" font-weight="600" fill="#1F2328" text-anchor="middle" >The world</text>
<text x="984" y="734" font-size="14" font-weight="400" fill="#667080" text-anchor="middle" >play, tests, what happened</text>
<line x1="984" y1="672" x2="984" y2="608" stroke="#7A828E" stroke-width="1.75" marker-end="url(#grey)"/>
<text x="1000" y="666" font-size="13" font-weight="500" fill="#667080" text-anchor="start" >feedback tunes it</text>
</svg>